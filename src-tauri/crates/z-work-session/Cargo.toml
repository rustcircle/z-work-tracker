[package]
name = "z-work-session"
version = "1.3.2"
edition.workspace = true
rust-version.workspace = true
description = "Whether the Windows session is locked, and the app's package identity. The workspace's only unsafe code, audited FFI calls"
license = "MIT"
authors = ["Pedro Miguel Rodrigues Jorge <pmrj@rustcircle.com>"]
repository = "https://github.com/rustcircle/z-work-tracker"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_RemoteDesktop",
] }

# Not the workspace's lints: its `forbid` could not be relaxed for the one module that needs it.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
