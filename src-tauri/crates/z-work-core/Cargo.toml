[package]
name = "z-work-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Tauri-independent core: state machine, persistence, sync merge, reports"
license = "MIT"
authors = ["Pedro Jorge <p@rustcircle.com>"]
repository = "https://github.com/rustcircle/z-work-tracker"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
rust_xlsxwriter = "0.90"
pdf-writer = "0.15"
png = "0.18"
miniz_oxide = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[lints]
workspace = true
