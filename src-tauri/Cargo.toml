[workspace]
resolver = "3"
members = [".", "crates/z-work-core", "crates/z-work-session"]

[workspace.package]
edition = "2024"
# The Rust this is built and tested with: rust-toolchain.toml follows stable, which was 1.99.1 when this was set.
# Tauri 2.12 alone needs 1.90.
rust-version = "1.99"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"

[package]
name = "z-work-tracker"
version = "1.4.0"
description = "Local-first labor hours tracker"
license = "MIT"
authors = ["Pedro Miguel Rodrigues Jorge <pmrj@rustcircle.com>"]
repository = "https://github.com/rustcircle/z-work-tracker"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "z_work_tracker_lib"
# Desktop only: a cdylib is for mobile, and MinGW refuses one with this many exported symbols.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
z-work-core = { path = "crates/z-work-core" }
# Same minor as @tauri-apps/api and @tauri-apps/cli in package.json (~2.12.x): the CLI warns when they differ.
tauri = { version = "~2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono-tz = "0.10"
hostname = "0.4"
tauri-plugin-notification = "2"
user-idle = "0.6"
z-work-session = { path = "crates/z-work-session" }
iana-time-zone = "0.1"

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["common-controls-v6"] }
# Start with Windows in the Store build, through the manifest's StartupTask. Already locked, for the crate below.
windows = { version = "0.62", features = ["ApplicationModel"] }
# Toasts under the Store package's own AppUserModelID. Already built for the notification plugin, which passes the
# Tauri identifier instead and drops the result.
tauri-winrt-notification = "0.8"

[features]
# Test-only hooks for scripts/native-smoke.mjs. Never enabled in shipped builds.
smoke = ["z-work-core/test-hooks"]

[lints]
workspace = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
