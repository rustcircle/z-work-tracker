name: Windows build

# Manual or tag only, as a fallback to the build from macOS. Signing is opt-in, chosen by the repository
# variable SIGNING_ROUTE:
#   unset or anything else  the build job. Without secrets it succeeds, and the artifact is called
#                           z-work-tracker-windows-UNSIGNED. With the self-signed certificate's secrets
#                           (see the README) or Azure's, every signature must verify.
#   signpath                the signpath job. Not in use: it stays dormant unless this variable is set.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # The same gates as every push to main. Packaging runs only if they pass.
  gates:
    uses: ./.github/workflows/ci.yml

  build:
    needs: gates
    if: vars.SIGNING_ROUTE != 'signpath'
    runs-on: windows-latest
    timeout-minutes: 45
    # Add protection rules to this environment in the repository settings; secrets live there.
    environment: windows-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            src-tauri/target
          key: windows-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
      - run: pnpm install --frozen-lockfile
      # Nothing here prints a secret, and with no secrets set every signing branch below is skipped.
      - name: Prepare signing
        id: signing
        shell: pwsh
        env:
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          WINDOWS_CERT_THUMBPRINT: ${{ secrets.WINDOWS_CERT_THUMBPRINT }}
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          # The cache restores src-tauri/target, so an installer from an earlier version could still be there.
          Remove-Item 'src-tauri\target\release\bundle\nsis\*-setup.exe' -Force -ErrorAction SilentlyContinue
          # The same order as scripts/windows-sign.mjs chooses in.
          $label = 'UNSIGNED'
          if ($env:AZURE_SIGNING_ACCOUNT) {
            $label = 'signed'
            cargo install trusted-signing-cli --version 0.11.0 --locked
            if ($LASTEXITCODE -ne 0) { exit 1 }
          } elseif ($env:WINDOWS_CERT_THUMBPRINT) {
            $label = 'signed'
          } elseif ($env:WINDOWS_CERT_PFX_BASE64 -or $env:WINDOWS_CERT_PASSWORD) {
            if (-not ($env:WINDOWS_CERT_PFX_BASE64 -and $env:WINDOWS_CERT_PASSWORD)) {
              Write-Error 'Set WINDOWS_CERT_PFX_BASE64 and WINDOWS_CERT_PASSWORD together, or neither.'
              exit 1
            }
            $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
            # Finds a bad secret now rather than after the build. The errors say nothing about its value.
            try {
              [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
              $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new($pfx, $env:WINDOWS_CERT_PASSWORD, [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet)
            } catch {
              Write-Error 'WINDOWS_CERT_PFX_BASE64 is not a base64 PFX that opens with WINDOWS_CERT_PASSWORD.'
              exit 1
            }
            if (-not $cert.HasPrivateKey) { Write-Error 'The PFX has no private key.'; exit 1 }
            if ($cert.NotAfter -lt (Get-Date)) { Write-Error "The certificate expired on $($cert.NotAfter.ToString('yyyy-MM-dd'))."; exit 1 }
            "WINDOWS_CERT_PFX_PATH=$pfx" >> $env:GITHUB_ENV
            $label = 'signed'
            if ($cert.Subject -eq $cert.Issuer) {
              $label = 'self-signed'
              # signtool verify /pa only accepts a chain this machine trusts, so a self-signed certificate
              # has to be trusted here, as on the PCs it is for. The public part only, on a runner that is thrown away.
              $public = [Security.Cryptography.X509Certificates.X509Certificate2]::new($cert.RawData)
              foreach ($name in 'Root', 'TrustedPublisher') {
                $store = [Security.Cryptography.X509Certificates.X509Store]::new($name, 'LocalMachine')
                $store.Open('ReadWrite')
                $store.Add($public)
                $store.Close()
              }
            }
            "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
            $cert.Dispose()
          }
          "label=$label" >> $env:GITHUB_OUTPUT
          if ($label -ne 'UNSIGNED') {
            $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signtool) { Write-Error 'signtool.exe was not found on this runner.'; exit 1 }
            "SIGNTOOL_PATH=$($signtool.FullName)" >> $env:GITHUB_ENV
          }
      - name: Build the installer
        env:
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          WINDOWS_CERT_THUMBPRINT: ${{ secrets.WINDOWS_CERT_THUMBPRINT }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: pnpm tauri build --bundles nsis
      # Runs even if the build failed or the run was cancelled. The PFX is not needed after the build.
      - name: Remove the temporary certificate
        if: always()
        shell: pwsh
        run: Remove-Item (Join-Path $env:RUNNER_TEMP 'cert.pfx') -Force -ErrorAction SilentlyContinue
      # What matters is what gets installed, so the files are read from inside the installer. Tauri signs a
      # copy of the exe for it: target\release\zWorkTracker.exe stays unsigned, also in a signed build.
      - name: Verify the signatures, or report unsigned
        shell: pwsh
        env:
          LABEL: ${{ steps.signing.outputs.label }}
          THUMBPRINT: ${{ steps.signing.outputs.thumbprint }}
        run: |
          $installer = (Get-ChildItem 'src-tauri\target\release\bundle\nsis\*-setup.exe' | Sort-Object LastWriteTime -Descending | Select-Object -First 1).FullName
          if (-not $installer) { Write-Error 'No installer was produced.'; exit 1 }
          if ($env:LABEL -eq 'UNSIGNED') {
            Write-Host '::warning title=Unsigned build::No signing secrets are set, so the installer and everything in it are unsigned.'
            "### UNSIGNED build`nNo signing secrets are set. Nothing in this installer is signed." >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          $content = Join-Path $env:RUNNER_TEMP 'installer-content'
          7z x $installer "-o$content" zWorkTracker.exe uninstall.exe WebView2Loader.dll -y | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Error 'The installer could not be opened with 7z.'; exit 1 }
          foreach ($needed in 'zWorkTracker.exe', 'uninstall.exe') {
            if (-not (Test-Path (Join-Path $content $needed))) { Write-Error "$needed was not found inside the installer."; exit 1 }
          }
          $files = @($installer) + (Get-ChildItem $content -File).FullName
          foreach ($file in $files) {
            & $env:SIGNTOOL_PATH verify /pa /v $file
            if ($LASTEXITCODE -ne 0) { Write-Error "Signature verification failed: $file"; exit 1 }
            $signature = Get-AuthenticodeSignature -LiteralPath $file
            if ($signature.Status -ne 'Valid') { Write-Error "Signature status is $($signature.Status): $file"; exit 1 }
            if (-not $signature.TimeStamperCertificate) { Write-Error "No timestamp: $file"; exit 1 }
            if ($env:THUMBPRINT -and $signature.SignerCertificate.Thumbprint -ne $env:THUMBPRINT) { Write-Error "Signed with a different certificate: $file"; exit 1 }
          }
          "### Build is $env:LABEL`nVerified: $(($files | Split-Path -Leaf) -join ', ')." >> $env:GITHUB_STEP_SUMMARY
          if ($env:LABEL -eq 'self-signed') {
            "Self-signed: only PCs that trust this certificate accept it. See the README." >> $env:GITHUB_STEP_SUMMARY
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # z-work-tracker-windows-UNSIGNED, -self-signed or -signed.
          name: z-work-tracker-windows-${{ steps.signing.outputs.label }}
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14

  # Dormant: nothing runs here unless SIGNING_ROUTE is signpath.
  # SignPath Foundation signs only what a GitHub-hosted runner built from this repository, so nothing
  # built on macOS goes through here. The exe is signed first, then packed into the installer, then
  # the installer is signed. The publisher Windows shows will be "SignPath Foundation".
  signpath:
    needs: gates
    if: vars.SIGNING_ROUTE == 'signpath'
    runs-on: windows-latest
    # A hosted job ends after 6 hours, so approve each request within that time.
    timeout-minutes: 350
    environment: signpath
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_DIR: src-tauri\target\release
      NSIS_DIR: src-tauri\target\release\nsis\x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - run: pnpm install --frozen-lockfile
      # Bundling writes into the exe, which would break a signature, so it runs before the exe is signed.
      - name: Build the exe and the unsigned installer script
        run: pnpm tauri build --bundles nsis
      - id: upload-exe
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-exe
          path: src-tauri/target/release/zWorkTracker.exe
          if-no-files-found: error
      - name: Sign the exe (waits for manual approval)
        uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          connector-url: ${{ vars.SIGNPATH_CONNECTOR_URL }}
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: z-work-tracker
          signing-policy-slug: release-signing
          artifact-configuration-slug: exe
          github-artifact-id: ${{ steps.upload-exe.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 18000
          output-artifact-directory: signed-exe
      - name: Pack the signed exe into the installer
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          Copy-Item signed-exe\zWorkTracker.exe "$env:RELEASE_DIR\zWorkTracker.exe" -Force
          $makensis = Get-ChildItem "$env:LOCALAPPDATA\tauri" -Recurse -Filter makensis.exe | Select-Object -First 1
          if (-not $makensis) { Write-Error 'makensis.exe not found in the Tauri tools folder'; exit 1 }
          Push-Location $env:NSIS_DIR
          & $makensis.FullName -INPUTCHARSET UTF8 installer.nsi
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Pop-Location
          New-Item -ItemType Directory -Force to-sign | Out-Null
          Copy-Item "$env:NSIS_DIR\nsis-output.exe" "to-sign\zWorkTracker_${env:REF_NAME}_x64-setup.exe"
      - id: upload-installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-installer
          path: to-sign/*.exe
          if-no-files-found: error
      - name: Sign the installer (waits for manual approval)
        uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          connector-url: ${{ vars.SIGNPATH_CONNECTOR_URL }}
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: z-work-tracker
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 18000
          output-artifact-directory: signed-installer
      - name: Verify the installer and the exe inside it
        shell: pwsh
        run: |
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Sort-Object FullName -Descending | Select-Object -First 1
          $installer = Get-ChildItem signed-installer\*.exe | Select-Object -First 1
          & $signtool.FullName verify /pa /v $installer.FullName
          if ($LASTEXITCODE -ne 0) { Write-Error 'The installer signature did not verify'; exit 1 }
          7z x $installer.FullName -oinstaller-content zWorkTracker.exe -r -y
          $inner = Get-ChildItem installer-content -Recurse -Filter zWorkTracker.exe | Select-Object -First 1
          if (-not $inner) { Write-Error 'zWorkTracker.exe was not found inside the installer'; exit 1 }
          & $signtool.FullName verify /pa /v $inner.FullName
          if ($LASTEXITCODE -ne 0) { Write-Error 'The exe inside the installer did not verify'; exit 1 }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: z-work-tracker-windows-signed
          path: signed-installer/*.exe
          retention-days: 14
