name: CI

# Fast gates on every push to main and every pull request into main. Nothing here signs, publishes
# or reads a secret. The Windows build workflow calls this same file before it packages.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows gates
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            src-tauri/target
          key: ci-windows-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ci-windows-
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec eslint . --max-warnings 0
      - run: pnpm exec vitest run
      - run: pnpm exec playwright install chromium
      - name: End-to-end tests against the mock backend
        run: pnpm exec playwright test
      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check
      # The no-network test reads the dependency tree of every desktop target offline, and a build only
      # downloads the crates of the host, so a fresh runner needs them fetched first.
      - name: Fetch crates for every target
        run: cargo fetch --manifest-path src-tauri/Cargo.toml --locked
      - name: Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - name: Rust lint, test-only commands
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets --locked --features smoke -- -D warnings
      - name: Rust tests, running on Windows
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace --locked
      - name: Add the MinGW target
        run: rustup target add x86_64-pc-windows-gnu
      - name: Rust test code compiles for the MinGW target
        run: cargo check --manifest-path src-tauri/Cargo.toml -p z-work-core -p z-work-session --tests --locked --target x86_64-pc-windows-gnu

  # Known vulnerabilities in what the app ships. Packaging waits for this job, so:
  # - These fail it: npm advisories rated moderate or above (production dependencies), and RustSec
  #   vulnerabilities rated medium or above or with no rating at all.
  # - These don't: unmaintained, unsound and other informational notices, and low ratings. They stay in the log.
  # - An outage of the npm registry, crates.io or GitHub doesn't either. That part goes unaudited, with a
  #   warning on the run, so read the warnings before trusting a green run for a release.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Audit JavaScript dependencies
        run: |
          # All levels for the log: the second run prints only what it would fail on.
          report="$(pnpm audit --prod --ignore-registry-errors 2>&1 || true)"
          printf '%s\n' "$report"
          case "$report" in
            *"Failed to request"*) echo "::warning title=JavaScript audit skipped::The npm registry did not answer, so JavaScript dependencies were not audited." ;;
          esac
          pnpm audit --prod --audit-level moderate --ignore-registry-errors
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Audit Rust dependencies
        run: |
          if ! cargo install cargo-audit --version 0.22.2 --locked; then
            echo "::warning title=Rust audit skipped::cargo-audit could not be installed, so Rust dependencies were not audited."
            exit 0
          fi
          if ! git clone --depth 1 https://github.com/RustSec/advisory-db.git "$RUNNER_TEMP/advisory-db"; then
            echo "::warning title=Rust audit skipped::The advisory database could not be fetched, so Rust dependencies were not audited."
            exit 0
          fi
          # All ratings for the log: from src-tauri, .cargo/audit.toml doesn't apply and the result doesn't count.
          (cd src-tauri && cargo audit --no-fetch --db "$RUNNER_TEMP/advisory-db" --file Cargo.lock) || true
          # From the root, .cargo/audit.toml leaves out low ratings. This is the run that can fail the job.
          cargo audit --no-fetch --db "$RUNNER_TEMP/advisory-db" --file src-tauri/Cargo.lock

  # The core only: it has Unix-only file handling that the Windows job never compiles.
  macos-core:
    name: macOS core tests
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            src-tauri/target
          key: ci-macos-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ci-macos-
      - name: Fetch crates for every target
        run: cargo fetch --manifest-path src-tauri/Cargo.toml --locked
      - name: Core lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -p z-work-core --all-targets --locked -- -D warnings
      - name: Core tests
        run: cargo test --manifest-path src-tauri/Cargo.toml -p z-work-core --locked
