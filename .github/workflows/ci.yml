name: CI

# Fast gates on every push to main and every pull request into main. Nothing here signs, publishes
# or reads a secret. The Windows build workflow calls this same file before it packages.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows gates
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            src-tauri/target
          key: ci-windows-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ci-windows-
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec eslint . --max-warnings 0
      - run: pnpm exec vitest run
      - run: pnpm exec playwright install chromium
      - name: End-to-end tests against the mock backend
        run: pnpm exec playwright test
      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check
      # The no-network test reads the dependency tree of every desktop target offline, and a build only
      # downloads the crates of the host, so a fresh runner needs them fetched first.
      - name: Fetch crates for every target
        run: cargo fetch --manifest-path src-tauri/Cargo.toml --locked
      - name: Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - name: Rust lint, test-only commands
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets --locked --features smoke -- -D warnings
      - name: Rust tests, running on Windows
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace --locked
      - name: Add the MinGW target
        run: rustup target add x86_64-pc-windows-gnu
      # The store's SQLite is C code, bundled by rusqlite and compiled for each target, so the MinGW check needs a MinGW
      # gcc. MSYS2 comes with the runner image; its gcc goes on the PATH of the steps after this one.
      - name: Install the MinGW-w64 gcc toolchain
        run: |
          C:\msys64\usr\bin\pacman.exe -Sy --noconfirm --needed mingw-w64-x86_64-gcc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & C:\msys64\mingw64\bin\x86_64-w64-mingw32-gcc.exe --version
      - name: Rust test code compiles for the MinGW target
        run: cargo check --manifest-path src-tauri/Cargo.toml -p z-work-core -p z-work-session --tests --locked --target x86_64-pc-windows-gnu

  # Known vulnerabilities in what the app ships. Packaging waits for this job, so:
  # - These fail it: npm advisories rated moderate or above (production dependencies), RustSec
  #   vulnerabilities rated medium or above or with no rating at all, and cargo-audit failing to install
  #   or the advisory database failing to download for any reason but an outage.
  # - These don't: unmaintained, unsound and other informational notices, and low ratings. They stay in the log.
  # - An outage of the npm registry, crates.io or GitHub doesn't. That part goes unaudited, with a
  #   warning on the run, so read the warnings before trusting a green run for a release.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Audit JavaScript dependencies
        run: |
          # pnpm exits 0 on a registry error when told to ignore it, and names the endpoint in what it prints.
          warn_if_down() {
            case "$1" in
              *"audit endpoint"*) echo "::warning title=JavaScript audit skipped::The npm registry did not answer properly, so JavaScript dependencies were not audited." ;;
            esac
          }
          # All levels for the log: the second run prints only what it would fail on.
          report="$(pnpm audit --prod --ignore-registry-errors 2>&1 || true)"
          printf '%s\n' "$report"
          warn_if_down "$report"
          status=0
          gate="$(pnpm audit --prod --audit-level moderate --ignore-registry-errors 2>&1)" || status=$?
          printf '%s\n' "$gate"
          warn_if_down "$gate"
          exit "$status"
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Audit Rust dependencies
        env:
          # The checks below read cargo's plain text. Colour codes would hide its error lines from them.
          CARGO_TERM_COLOR: never
        run: |
          install_log="$RUNNER_TEMP/cargo-audit-install.log"
          if ! cargo install cargo-audit --version 0.22.2 --locked > "$install_log" 2>&1; then
            cat "$install_log"
            # Only cargo's last error says why it gave up. Retries and a failing build's output come before it.
            last_error="$(awk '/^error/ { text = ""; seen = 1 } seen { text = text $0 "\n" } END { printf "%s", text }' "$install_log")"
            # An outage is a rate limit or 5xx from the registry, or a connection curl gave up on. Anything else,
            # such as a yanked version, a newer rustc or a bad checksum, would skip the audit on every run from now on.
            outage='^ *\[(6|7|16|18|28|35|52|55|56|92)\] |, got (429|5[0-9][0-9])$'
            if ! grep -qE "$outage" <<< "$last_error"; then
              echo "::error title=Rust audit broken::cargo-audit 0.22.2 could not be installed, and not because of an outage. Read the error above; the pinned version may need updating."
              exit 1
            fi
            echo "::warning title=Rust audit skipped::cargo-audit could not be downloaded, so Rust dependencies were not audited."
            exit 0
          fi
          clone_log="$RUNNER_TEMP/advisory-db-clone.log"
          if ! GIT_TERMINAL_PROMPT=0 LC_ALL=C git clone --depth 1 https://github.com/RustSec/advisory-db.git "$RUNNER_TEMP/advisory-db" > "$clone_log" 2>&1; then
            cat "$clone_log"
            # Only git's own lines count: what a server sends back is printed too, prefixed with remote:.
            clone_errors="$(grep -E '^(fatal|error):' "$clone_log" || true)"
            # The same rule as above: a rate limit, a 5xx or a connection that failed. A repository gone or
            # refused (404, 403), a bad TLS certificate or a full disk would skip the audit on every run from now on.
            clone_outage='returned error: (429|5[0-9][0-9])|RPC failed; HTTP (429|5[0-9][0-9])|RPC failed; curl (6|7|16|18|28|35|52|55|56|92) |Could not resolve host|Failed to connect|timed out|Empty reply|Connection reset|SSL connect error|SSL_connect|SSL_ERROR_SYSCALL|gnutls_handshake|GnuTLS recv error|transfer closed|Recv failure|early EOF|hung up unexpectedly|unexpected disconnect'
            if ! grep -qE "$clone_outage" <<< "$clone_errors" || grep -q 'No space left' "$clone_log"; then
              echo "::error title=Rust audit broken::The advisory database could not be downloaded, and not because of an outage. Read the error above."
              exit 1
            fi
            echo "::warning title=Rust audit skipped::The advisory database could not be fetched, so Rust dependencies were not audited."
            exit 0
          fi
          # All ratings for the log: from src-tauri, .cargo/audit.toml doesn't apply and the result doesn't count.
          (cd src-tauri && cargo audit --no-fetch --db "$RUNNER_TEMP/advisory-db" --file Cargo.lock) || true
          # From the root, .cargo/audit.toml leaves out low ratings. This is the run that can fail the job.
          cargo audit --no-fetch --db "$RUNNER_TEMP/advisory-db" --file src-tauri/Cargo.lock

  # The core only: it has Unix-only file handling that the Windows job never compiles.
  macos-core:
    name: macOS core tests
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            src-tauri/target
          key: ci-macos-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ci-macos-
      - name: Fetch crates for every target
        run: cargo fetch --manifest-path src-tauri/Cargo.toml --locked
      - name: Core lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -p z-work-core --all-targets --locked -- -D warnings
      - name: Core tests
        run: cargo test --manifest-path src-tauri/Cargo.toml -p z-work-core --locked
